<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=1920" />
  <title>판다마켓</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav>
    <div class="nav-left">
      <img src="logo.png">
      <a class="nav-title" href="/">판다마켓</a>
    </div>
    <a class="nav-btn" href="/login">로그인</a>
  </nav>

  <section class="hero">
    <div class="hero-text">
      <h1>일상의 모든 물건을<br>거래해 보세요</h1>
      <a class="btn" href="/items">구경하러 가기</a>
    </div>
    <div class="hero-image">
      <img src="img1.png">
    </div>
  </section>

  <section class="section">
    <div class="img-box">
      <img src="img3.png">
    </div>
    <div class="text-box">
      <h2>인기 상품을 확인해 보세요</h2>
      <p>가장 많이 찜된 중고거래 물품을 한눈에 확인해보세요.</p>
    </div>
  </section>

  <section class="section reverse">
    <div class="img-box">
      <img src="img4.png">
    </div>
    <div class="text-box">
      <h2>구매를 원하는 상품을 검색하세요</h2>
      <p>구매하고 싶은 물품을 카테고리와 키워드로 찾아보세요.</p>
    </div>
  </section>

  <section class="section">
    <div class="img-box">
      <img src="img5.png">
    </div>
    <div class="text-box">
      <h2>판매를 원하는 상품을 등록하세요</h2>
      <p>사진과 설명을 추가하여 손쉽게 중고 물품을 등록해보세요.</p>
    </div>
  </section>

  <section class="final">
    <div class="final-text">
      <h2>믿을 수 있는<br>판다마켓 중고 거래</h2>
    </div>
    <div class="final-image">
      <img src="img2.png">
    </div>
  </section>

  <div class="bottom-space"></div>
</body>
</html>
