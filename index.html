<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=1920" />
  <title>판다마켓</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 네비게이션 -->
  <nav>
    <div class="nav-left">
      <img src="logo.png">
      <a href="/" class="nav-title">판다마켓</a>
    </div>
    <button class="nav-btn">로그인</button>
  </nav>

  <!-- Hero Section -->
  <section class="hero">
    <div class="hero-text">
      <h1>일상의 모든 물건을<br>거래해 보세요</h1>
      <a href="/items" class="btn">구경하러 가기</a>
    </div>
    <div class="hero-image">
      <img src="img1.png">
    </div>
  </section>

  <!-- 섹션 2 -->
  <section class="section">
    <div class="img-box">
      <img src="img3.png">
    </div>
    <div class="text-box">
      <h2>인기 상품을 확인해 보세요</h2>
      <p>가장 많이 찜된 중고거래 물품을 한눈에 확인해보세요.</p>
    </div>
  </section>

  <!-- 섹션 3 -->
  <section class="section reverse">
    <div class="img-box">
      <img src="img4.png">
    </div>
    <div class="text-box">
      <h2>구매를 원하는 상품을 검색하세요</h2>
      <p>구매하고 싶은 물품을 카테고리와 키워드로 찾아보세요.</p>
    </div>
  </section>

  <!-- 섹션 4 -->
  <section class="section">
    <div class="img-box">
      <img src="img5.png">
    </div>
    <div class="text-box">
      <h2>판매를 원하는 상품을 등록하세요</h2>
      <p>사진과 설명을 추가하여 손쉽게 중고 물품을 등록해보세요.</p>
    </div>
  </section>

  <!-- 마지막 섹션 -->
  <section class="final">
    <div class="final-text">
      <h2>믿을 수 있는<br>판다마켓 중고 거래</h2>
    </div>
    <div class="final-image">
      <img src="img2.png">
    </div>
  </section>

  <div class="bottom-space"></div>

  <!-- 클릭 이동 기능 -->
  <script>
    document.querySelector('.nav-title').addEventListener('click', () => {
      window.location.href = '/';
    });
    document.querySelector('.btn').addEventListener('click', () => {
      window.location.href = '/items';
    });
    document.querySelector('.nav-btn').addEventListener('click', () => {
      window.location.href = '/login';
    });
  </script>
</body>
</html>
