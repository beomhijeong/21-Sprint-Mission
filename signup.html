<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>회원가입 | 판다마켓</title>
  <link rel="stylesheet" href="auth.css">
</head>
<body class="auth-body">
  <div class="auth-container">
    <img class="auth-logo" src="logo.png" alt="판다마켓 로고">
    <h1 class="auth-title">판다마켓</h1>

    <form class="auth-form">
      <label>이메일</label>
      <input type="email" placeholder="codeit@email.com">

      <label>닉네임</label>
      <input type="text" placeholder="판다">

      <label>비밀번호</label>
      <input type="password" placeholder="••••••••">

      <label>비밀번호 확인</label>
      <input type="password" placeholder="asdf…">

      <a href="signup.html" class="auth-btn">회원가입</a>
    </form>

    <p class="auth-bottom-text">
      이미 회원이신가요?
      <a href="login.html">로그인</a>
    </p>
  </div>
</body>
</html>
